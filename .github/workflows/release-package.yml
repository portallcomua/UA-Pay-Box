name: Validate and package UA Pay Box

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP syntax check
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  package-release:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist/ua-pay-box
          git archive HEAD | tar -x -C dist/ua-pay-box
          cd dist
          zip -r ua-pay-box.zip ua-pay-box
      - name: Upload ZIP to the published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/ua-pay-box.zip --repo "$GITHUB_REPOSITORY" --clobber
